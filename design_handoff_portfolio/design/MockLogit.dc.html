<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; width:100%; background:#FFFFFF; border:1px solid #DDE2DC; border-radius:14px; box-shadow:0 24px 48px -28px rgba(20,40,35,.35), 0 2px 6px rgba(20,40,35,.06); overflow:hidden; font-family:'Instrument Sans',system-ui,sans-serif; color:#141715; display:grid; grid-template-columns:118px minmax(0,1fr);">
  <div style="border-right:1px solid #ECEFEA; padding:14px 10px; display:flex; flex-direction:column; gap:4px; font-size:10.5px; color:#4A514B;">
    <div style="font-weight:700; font-size:13px; color:#141715; padding:0 6px 12px;">Platform</div>
    <div style="padding:6px 8px;">Operations</div>
    <div style="padding:6px 8px; background:#E7EFE7; border-radius:6px; color:#084D46; font-weight:600;">Orders</div>
    <div style="padding:6px 8px;">Shipments</div>
    <div style="padding:6px 8px;">Customs</div>
    <div style="padding:6px 8px;">Suppliers</div>
  </div>
  <div style="padding:14px 16px; min-width:0;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px;"><div style="font-size:15px; font-weight:700;">Purchase orders</div><span style="background:#084D46; color:#fff; border-radius:6px; padding:4px 8px; font-size:10px;">+ New order</span></div>
    <div style="display:flex; gap:14px; font-size:10px; color:#606760; border-bottom:1px solid #ECEFEA; padding-bottom:6px; margin-bottom:4px;"><span style="color:#084D46; font-weight:600;">All</span><span>In process</span><span>Arrived</span></div>
    <div style="display:grid; grid-template-columns:1.2fr 1fr .9fr; font-size:10px; row-gap:0;">
      <div style="padding:7px 0; color:#606760; border-bottom:1px solid #F1F3EF;">Reference</div><div style="padding:7px 0; color:#606760; border-bottom:1px solid #F1F3EF;">Origin</div><div style="padding:7px 0; color:#606760; border-bottom:1px solid #F1F3EF;">Status</div>
      <div style="padding:7px 0; border-bottom:1px solid #F1F3EF;">PO-0001</div><div style="padding:7px 0; border-bottom:1px solid #F1F3EF;">Sample A</div><div style="padding:5px 0; border-bottom:1px solid #F1F3EF;"><span style="background:#E8F2FA; border-radius:4px; padding:2px 6px;">In transit</span></div>
      <div style="padding:7px 0; border-bottom:1px solid #F1F3EF;">PO-0002</div><div style="padding:7px 0; border-bottom:1px solid #F1F3EF;">Sample B</div><div style="padding:5px 0; border-bottom:1px solid #F1F3EF;"><span style="background:#FAEEE2; border-radius:4px; padding:2px 6px;">Customs</span></div>
      <div style="padding:7px 0; border-bottom:1px solid #F1F3EF;">PO-0003</div><div style="padding:7px 0; border-bottom:1px solid #F1F3EF;">Sample C</div><div style="padding:5px 0; border-bottom:1px solid #F1F3EF;"><span style="background:#E7EFE7; border-radius:4px; padding:2px 6px;">Arrived</span></div>
      <div style="padding:7px 0;">PO-0004</div><div style="padding:7px 0;">Sample D</div><div style="padding:5px 0;"><span style="background:#EEECF9; border-radius:4px; padding:2px 6px;">In process</span></div>
    </div>
  </div>
  <div style="position:absolute; right:10px; bottom:10px; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#606760; background:rgba(248,246,241,.92); border:1px solid #D5DAD3; border-radius:999px; padding:3px 9px;">Illustrative · not the real product</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:260}}"></script>
</body>
</html>
