<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative; width:100%; background:#FFFDF9; border:1px solid #E9DCCB; border-radius:14px; box-shadow:0 24px 48px -28px rgba(70,45,20,.35), 0 2px 6px rgba(70,45,20,.06); overflow:hidden; font-family:'Instrument Sans',system-ui,sans-serif; color:#141715; display:grid; grid-template-columns:112px minmax(0,1fr);">
  <div style="border-right:1px solid #F1E7DA; padding:14px 10px; display:flex; flex-direction:column; gap:4px; font-size:10.5px; color:#5E5248;">
    <div style="font-family:'Newsreader',Georgia,serif; font-size:16px; color:#084D46; padding:0 6px 10px;">Bosvia</div>
    <div style="padding:6px 8px;">Dashboard</div>
    <div style="padding:6px 8px; background:#E7EFE7; border-radius:6px; color:#084D46; font-weight:600;">Reservations</div>
    <div style="padding:6px 8px;">Lodging</div>
    <div style="padding:6px 8px;">Guests</div>
    <div style="padding:6px 8px;">Experiences</div>
  </div>
  <div style="padding:14px 16px; min-width:0;">
    <div style="font-size:14px; font-weight:700; margin-bottom:10px;">Reservation calendar</div>
    <div style="display:grid; grid-template-columns:64px repeat(5,minmax(0,1fr)); font-size:9.5px; border:1px solid #F1E7DA; border-radius:8px; overflow:hidden;">
      <div style="background:#FBF6EF;"></div><div style="background:#FBF6EF; padding:5px; text-align:center; color:#7A6E63;">Mon</div><div style="background:#FBF6EF; padding:5px; text-align:center; color:#7A6E63;">Tue</div><div style="background:#FBF6EF; padding:5px; text-align:center; color:#7A6E63;">Wed</div><div style="background:#FBF6EF; padding:5px; text-align:center; color:#7A6E63;">Thu</div><div style="background:#FBF6EF; padding:5px; text-align:center; color:#7A6E63;">Fri</div>
      <div style="padding:8px 6px; border-top:1px solid #F4ECE1;">Cabin 1</div><div style="grid-column:span 2; padding:4px; border-top:1px solid #F4ECE1;"><div style="background:#E7EFE7; border-radius:5px; padding:4px 6px;">Guest · 2</div></div><div style="border-top:1px solid #F4ECE1;"></div><div style="border-top:1px solid #F4ECE1;"></div><div style="border-top:1px solid #F4ECE1;"></div>
      <div style="padding:8px 6px; border-top:1px solid #F4ECE1;">Cabin 2</div><div style="border-top:1px solid #F4ECE1;"></div><div style="grid-column:span 3; padding:4px; border-top:1px solid #F4ECE1;"><div style="background:#E8F2FA; border-radius:5px; padding:4px 6px;">Guest · 2</div></div><div style="border-top:1px solid #F4ECE1;"></div>
      <div style="padding:8px 6px; border-top:1px solid #F4ECE1;">Dome</div><div style="border-top:1px solid #F4ECE1;"></div><div style="border-top:1px solid #F4ECE1;"></div><div style="grid-column:span 3; padding:4px; border-top:1px solid #F4ECE1;"><div style="background:#FAEEE2; border-radius:5px; padding:4px 6px;">Guest · 4</div></div>
    </div>
  </div>
  <div style="position:absolute; right:10px; bottom:10px; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#6B5E52; background:rgba(255,253,249,.94); border:1px solid #E9DCCB; border-radius:999px; padding:3px 9px;">Concept mockup</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:240}}"></script>
</body>
</html>
